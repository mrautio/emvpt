[package]
name = "emvpt"
version = "0.1.0"
authors = ["Mika Rautio"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]

[dependencies]
iso7816-tlv = "0.4.4"
hexplay = "0.3.0"
asn1_der = "0.7.7"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
log = "0.4.34"
log4rs = "1.4.0"
rand_chacha = "0.10.0"
rand = "0.10.3"
# NOTE: mingw pre built binaries here: https://bintray.com/vszakats/generic/openssl
openssl-sys = "0.9.117"
openssl = "0.10.81"
chrono = "0.4.45"
regex = "1.13.1"
